<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anisha Reddy — Brand &amp; Storytelling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500;1,9..144,600&amp;family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&amp;family=Caveat:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --cream:#eef1f4;       /* cool mist page */
    --peach:#e6e9f2;       /* soft cool tint */
    --sand:#dde2ec;
    --clay:#6a5fa0;        /* eyebrow / label mauve */
    --terracotta:#5560a8;  /* primary accent — periwinkle */
    --rust:#43488a;        /* darker accent */
    --gold:#6f5aa0;        /* highlight mauve */
    --ink:#262c3b;         /* cool slate ink */
    --cocoa:#211a2c;       /* deep plum dark */
    --muted:#6f778c;
    --line:#d7dde7;
    --card:#fbfcfe;
    --olive:#5b4f86;       /* lilac chip text */
    --pine:#211a2c;        /* LOR plum band */
    --plum:#3a2350;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Work Sans', sans-serif;
    background: var(--cream);
    color: var(--ink);
    line-height: 1.65;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .display { font-family: 'Fraunces', serif; font-weight: 500; }
  .script { font-family: 'Caveat', cursive; }
  h1, h2, h3 { font-family: 'Fraunces', serif; font-weight: 500; letter-spacing: -0.01em; line-height: 1.08; }
  a { color: var(--terracotta); text-decoration: none; }
  a:hover { text-decoration: underline; }
  img { max-width: 100%; }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 0 30px; }
  .fullbleed { width: 100vw; margin-left: calc(50% - 50vw); }

  /* ---- reveal animation ---- */
  .rv { opacity: 0; transform: translateY(28px); animation: rvIn .8s cubic-bezier(.2,.7,.2,1) forwards; }
  .rv.d1{animation-delay:.1s;} .rv.d2{animation-delay:.18s;} .rv.d3{animation-delay:.26s;} .rv.d4{animation-delay:.34s;}
  .rv.in { opacity: 1; transform: none; }
  @keyframes rvIn { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){ .rv{ opacity:1; transform:none; animation:none; } }

  /* ---- nav ---- */
  nav {
    position: sticky; top: 0; z-index: 40;
    background: rgba(238,241,244,0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  nav .wrap { display: flex; justify-content: space-between; align-items: center; padding: 14px 30px; gap: 16px; }
  nav .brand { font-family:'Fraunces',serif; font-size: 1.2rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
  nav .tabs { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  nav .tab {
    background: none; border: 0; cursor: pointer;
    font-family: 'Work Sans', sans-serif; font-size: 0.86rem; color: var(--ink);
    padding: 7px 14px; border-radius: 999px; transition: all .18s ease;
  }
  nav .tab:hover { background: var(--peach); }
  nav .tab.active { background: var(--terracotta); color: #fff; }
  @media (max-width: 760px){
    nav .wrap { flex-direction: column; align-items: stretch; }
    nav .tabs { justify-content: flex-start; overflow-x: auto; padding-bottom: 4px; }
    nav .tab { white-space: nowrap; }
  }

  section { padding: 70px 0; }
  .eyebrow { color: var(--clay); letter-spacing: 0.16em; text-transform: uppercase; font-size: 0.74rem; font-weight: 600; margin-bottom: 14px; }
  .hand { font-family:'Caveat',cursive; font-size: 1.5rem; color: var(--terracotta); font-weight:600; display:inline-block; transform: rotate(-3deg); }
  h2 { font-size: clamp(1.9rem, 4.4vw, 3rem); }

  /* ---- DYNAMIC HERO ---- */
  .hero { position: relative; min-height: 92vh; display: flex; align-items: flex-end; overflow: hidden; }
  .hero-bg { position: absolute; inset: 0; z-index: 0; }
  .hb { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0;
        transition: opacity 1.6s ease; transform: scale(1.06); animation: kenburns 16s ease-in-out infinite alternate; }
  .hb.on { opacity: 1; }
  @keyframes kenburns { from{ transform: scale(1.04) translate(0,0);} to{ transform: scale(1.14) translate(-1.5%,-1.5%);} }
  .hero-scrim { position:absolute; inset:0; z-index:1;
    background:
      linear-gradient(180deg, rgba(33,26,44,.34) 0%, rgba(31,28,56,.20) 40%, rgba(33,26,44,.82) 100%),
      linear-gradient(120deg, rgba(85,96,168,.30), rgba(111,90,160,.26) 60%, rgba(35,32,56,.20)); }
  .hero-scrim::after{ content:''; position:absolute; inset:0;
    background: radial-gradient(120% 80% at 15% 90%, rgba(33,26,44,.55), transparent 62%); }
  .hero-inner { position: relative; z-index: 2; padding: 0 30px 70px; max-width: 1060px; margin: 0 auto; width: 100%; color: #f1eef7; }
  .hero-inner .kicker { font-family:'Caveat',cursive; font-size: 1.7rem; color: #c9b9e6; font-weight:600; transform: rotate(-2deg); display:inline-block; margin-bottom: 6px; }
  .hero-inner h1 { font-family:'Fraunces',serif; font-weight: 500; font-size: clamp(2.6rem, 6.4vw, 5rem); line-height: 1.02; color:#f5f2fb; text-shadow: 0 2px 40px rgba(0,0,0,.25); }
  .hero-inner h1 em { font-style: italic; color: #aab1e0; }
  .hero-inner .lede { font-size: 1.16rem; color: #ddd9ea; margin-top: 24px; max-width: 620px; line-height:1.6; }
  .hero-tags { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 9px; }
  .hero-tags span { border: 1px solid rgba(241,238,247,.42); border-radius: 999px; padding: 6px 15px; font-size: 0.8rem; color: #f1eef7; backdrop-filter: blur(4px); background: rgba(33,26,44,.22); }
  .hero-cue { position:absolute; z-index:2; bottom:24px; left:50%; transform:translateX(-50%); color:#f1eef7; font-size:.72rem; letter-spacing:.2em; text-transform:uppercase; opacity:.8; display:flex; align-items:center; gap:10px;}
  .hero-cue .ln{ width:1px; height:30px; background:#f1eef7; animation: drop 1.8s ease-in-out infinite; transform-origin:top;}
  @keyframes drop{0%,100%{transform:scaleY(.3);opacity:.4;}50%{transform:scaleY(1);opacity:1;}}

  /* ---- workplace cards ---- */
  .worktitle { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  .places { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 34px; }
  @media (max-width: 720px){ .places { grid-template-columns: 1fr; } }
  .place-card {
    position: relative; border-radius: 18px; overflow: hidden; cursor: pointer; min-height: 280px;
    display:flex; flex-direction: column; justify-content: flex-end; padding: 28px;
    color:#f1eef7; border:1px solid var(--line); transition: transform .25s ease, box-shadow .25s ease;
    background: var(--cocoa);
  }
  .place-card .pc-bg{ position:absolute; inset:0; background-size:cover; background-position:center; z-index:0; transition: transform .5s ease; }
  .place-card .pc-grad{ position:absolute; inset:0; z-index:1; background: linear-gradient(180deg, rgba(33,26,48,.30), rgba(33,26,44,.88)); }
  .place-card.nopic .pc-bg{ background: linear-gradient(150deg, #3a3470, #211a2c); }
  .place-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(33,26,44,0.26); }
  .place-card:hover .pc-bg { transform: scale(1.07); }
  .place-card > * { position: relative; z-index: 2; }
  .place-card .role { color: #c9b9e6; font-size: 0.74rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .place-card h3 { font-size: 1.7rem; margin: 8px 0 6px; color:#f5f2fb; }
  .place-card p { font-size: 0.92rem; color: #dcd8e8; }
  .place-card .count { margin-top: 16px; font-size: 0.82rem; color: #c9b9e6; font-weight: 500; }

  /* ---- about ---- */
  .about-intro { display:grid; grid-template-columns: 290px 1fr; gap: 36px; align-items:center; margin: 8px 0 4px; }
  .about-portrait { border-radius:18px; overflow:hidden; aspect-ratio:4/5; background:var(--sand); border:1px solid var(--line); }
  .about-portrait img { width:100%; height:100%; object-fit:cover; display:block; }
  .about-intro h2 { font-size: clamp(1.7rem, 3.6vw, 2.5rem); }
  .about-intro p { margin-top: 16px; }
  @media (max-width: 680px){ .about-intro { grid-template-columns: 1fr; gap: 22px; } .about-portrait { max-width: 280px; } }
  .about p { font-size: 1.07rem; color: #454b5e; margin-top: 18px; max-width: 740px; }
  .about strong { color: var(--terracotta); font-weight: 600; }
  .traits { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 30px; }
  @media (max-width: 640px){ .traits { grid-template-columns: 1fr 1fr; } }
  .trait { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; transition: transform .2s ease; }
  .trait:hover { transform: translateY(-3px); }
  .trait h3 { font-size: 1.15rem; margin-bottom: 6px; }
  .trait p { font-size: 0.88rem; color: var(--muted); }
  .range { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .range span { font-family:'Fraunces',serif; font-size: 1rem; color: var(--ink); background: var(--card); border:1px solid var(--line); padding: 9px 16px; border-radius: 10px; }
  blockquote { font-family:'Fraunces',serif; font-style: italic; font-size: 1.4rem; color: var(--ink); line-height: 1.42; max-width: 760px; border-left: 3px solid var(--clay); padding-left: 26px; margin-top: 44px; }
  blockquote cite { display:block; font-style: normal; font-family:'Work Sans',sans-serif; font-size: 0.88rem; color: var(--muted); margin-top: 16px; }

  /* ---- slideshow ---- */
  .slides { position: relative; width: 100%; height: 440px; border-radius: 20px; overflow: hidden; background: var(--sand); }
  .slides.tall { height: 460px; }
  .slide { position: absolute; inset: 0; opacity: 0; transition: opacity .9s ease; }
  .slide.on { opacity: 1; }
  .slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dots { position: absolute; bottom: 16px; left: 0; right: 0; display: flex; gap: 8px; justify-content: center; z-index: 2; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.55); transition: background .3s; cursor: pointer; }
  .dot.on { background: #fff; }
  .snav { position:absolute; top:50%; transform:translateY(-50%); z-index:3; width:42px; height:42px; border-radius:50%;
    border:0; cursor:pointer; background:rgba(33,26,44,.45); color:#fff; font-size:1.6rem; line-height:1; display:flex;
    align-items:center; justify-content:center; backdrop-filter:blur(4px); transition:background .2s; padding-bottom:3px; }
  .snav:hover { background:rgba(33,26,44,.8); }
  .snav.prev { left:14px; } .snav.next { right:14px; }
  @media (max-width: 640px){ .slides, .slides.tall { height: 300px; } }

  /* ---- workplace header ---- */
  .wp-head { padding: 60px 0 26px; }
  .wp-head .role { color: var(--clay); font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
  .wp-head h2 { margin: 8px 0 14px; }
  .wp-head p { color: #454b5e; max-width: 720px; font-size: 1.05rem; }
  .back { background:none; border:0; cursor:pointer; color: var(--terracotta); font-family:'Work Sans',sans-serif; font-size: 0.88rem; margin-bottom: 18px; padding: 0; }
  .back:hover { text-decoration: underline; }

  /* ---- MediaSolace intro band ---- */
  .ms-stats { display:grid; grid-template-columns: repeat(3,1fr); gap:0; border-top:1.5px solid var(--ink); border-bottom:1.5px solid var(--ink); margin: 30px 0 0; }
  .ms-stats .s { padding: 26px 24px; border-right: 1.5px solid var(--ink); }
  .ms-stats .s:last-child { border-right: none; }
  .ms-stats .num { font-family:'Fraunces',serif; font-size: 2.9rem; line-height:1; color: var(--terracotta); }
  .ms-stats .lab { font-size: 0.82rem; letter-spacing:.04em; text-transform:uppercase; color: var(--muted); margin-top: 8px; }
  @media(max-width:640px){ .ms-stats{ grid-template-columns:1fr;} .ms-stats .s{ border-right:none; border-bottom:1.5px solid var(--ink);} .ms-stats .s:last-child{border-bottom:none;} }
  .ms-resp { margin-top: 40px; }
  .ms-resp h3 { font-size: 1.4rem; margin-bottom: 16px; }
  .ms-resp ul { columns: 2; column-gap: 40px; list-style: none; }
  @media(max-width:640px){ .ms-resp ul{ columns:1; } }
  .ms-resp li { font-size: 0.96rem; color:#454b5e; padding: 8px 0 8px 26px; position: relative; break-inside: avoid; }
  .ms-resp li::before { content:''; position:absolute; left:0; top:15px; width:10px; height:10px; border-radius:50%; background: var(--gold); }

  /* ---- LOR block ---- */
  .lor { position: relative; margin: 50px 0 10px; background: var(--pine); color:#efe9f3; border-radius: 18px; padding: 54px 50px; overflow:hidden; }
  .lor .qmark { position:absolute; top:18px; right:36px; font-family:'Fraunces',serif; font-size: 150px; line-height:.7; color: rgba(201,185,230,.16); }
  .lor blockquote { font-family:'Fraunces',serif; font-style: italic; font-size: clamp(1.2rem,2.3vw,1.7rem); line-height:1.36; color:#efe9f3; border:0; padding:0; margin:0; max-width: 800px; position:relative; z-index:2; }
  .lor .by { font-size: 0.84rem; letter-spacing:.08em; text-transform:uppercase; margin-top: 24px; opacity:.85; }
  .lor .btn { display:inline-flex; align-items:center; gap:9px; margin-top: 26px; font-size: 0.84rem; letter-spacing:.06em; text-transform:uppercase;
    background: #c3b2e0; color: #241a2e; text-decoration:none; padding: 13px 22px; border-radius: 999px; transition: transform .22s ease; font-weight:500; }
  .lor .btn:hover { transform: translateY(-2px); text-decoration:none; }

  /* fun fact */
  .funfact { display:flex; gap: 22px; align-items:center; background: linear-gradient(135deg, #e9e4f4, #dfe3f0); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; margin: 32px 0 0; }
  .funfact .ff-img { width: 130px; height: 130px; border-radius: 14px; overflow:hidden; flex-shrink:0; background: var(--sand); }
  .funfact .ff-img img { width:100%; height:100%; object-fit: cover; }
  .funfact .ff-tag { font-family:'Caveat',cursive; color: var(--terracotta); font-weight: 600; font-size: 1.2rem; }
  .funfact h3 { font-size: 1.35rem; margin: 2px 0 6px; }
  .funfact p { font-size: 0.94rem; color: #454b5e; }
  @media (max-width: 560px){ .funfact { flex-direction: column; text-align: center; } .funfact .ff-img{ width:100%; height: 190px; } }

  /* ---- brand case-study list ---- */
  .brand-list { padding: 14px 0 70px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width:720px){ .brand-list{ grid-template-columns:1fr; } }
  .brand-row { display:flex; gap: 18px; align-items:center; background: var(--card); border:1px solid var(--line); border-radius: 18px; padding: 22px; cursor:pointer; transition: transform .2s ease, box-shadow .2s ease; }
  .brand-row:hover { transform: translateY(-4px); box-shadow: 0 16px 32px rgba(33,26,44,0.12); }
  .brand-row .logo { width: 84px; height: 84px; border-radius: 16px; background:#fff; border:1px solid var(--line); flex-shrink:0; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .brand-row .logo img { width:100%; height:100%; object-fit: contain; padding: 12px; }
  .brand-row .info h3 { font-size: 1.3rem; }
  .brand-row .info .cat { color: var(--clay); font-size: 0.72rem; font-weight:600; letter-spacing: 0.06em; text-transform: uppercase; }
  .brand-row .info p { font-size: 0.9rem; color: #454b5e; margin-top: 5px; }
  .brand-row .info .more { font-size: 0.8rem; color: var(--terracotta); margin-top: 10px; font-weight:500; }
  @media (max-width: 480px){ .brand-row { flex-direction: column; text-align:center; } }

  /* ---- project cards (non-brand) ---- */
  .proj-list { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; padding: 20px 0 70px; }
  @media (max-width: 720px){ .proj-list { grid-template-columns: 1fr; } }
  .proj-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; cursor: pointer; transition: transform .2s ease, box-shadow .2s ease; }
  .proj-card:hover { transform: translateY(-4px); box-shadow: 0 16px 32px rgba(33,26,44,0.12); }
  .proj-card .thumb { height: 200px; background: var(--sand); position: relative; overflow: hidden; }
  .proj-card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s ease; }
  .proj-card:hover .thumb img { transform: scale(1.05); }
  .proj-card .body { padding: 22px 24px 26px; }
  .proj-card h3 { font-size: 1.3rem; margin-bottom: 6px; }
  .proj-card .meta { color: var(--muted); font-size: 0.84rem; margin-bottom: 10px; }
  .proj-card p { font-size: 0.92rem; color: #454b5e; }
  .proj-card .open { margin-top: 14px; font-size: 0.82rem; color: var(--terracotta); font-weight: 500; }

  /* placeholder */
  .ph { width:100%; height:100%; display:flex; align-items:center; justify-content:center;
        background: linear-gradient(135deg, var(--clay), var(--olive)); color:#fff; }
  .ph span { font-family:'Fraunces',serif; font-style:italic; font-size:1.1rem; opacity:.92; padding: 0 16px; text-align:center; }
  .ph.logo-ph { background: linear-gradient(135deg, var(--peach), var(--sand)); color: var(--ink); }
  .ph.logo-ph span { font-style: normal; font-weight: 600; font-size: 0.92rem; }

  /* ---- detail / case study ---- */
  .detail { padding: 40px 0 90px; max-width: 820px; }
  .detail .role { color: var(--clay); font-size: 0.78rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
  .detail h2 { margin: 8px 0 6px; }
  .detail .meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 26px; }
  .detail .hero-img { width:100%; height: 360px; border-radius: 20px; overflow: hidden; margin-bottom: 30px; background: var(--sand); }
  .detail .hero-img img { width:100%; height:100%; object-fit: cover; display:block; }
  .detail .hero-img.contain { background: #fff; border:1px solid var(--line); }
  .detail .hero-img.contain img { object-fit: contain; padding: 40px; }
  .detail .lead { font-family:'Fraunces',serif; font-style:italic; font-size: clamp(1.2rem,2.2vw,1.55rem); line-height:1.42; color: var(--ink); margin-bottom: 8px; }
  .detail .lead em { font-style: normal; color: var(--terracotta); }
  .detail h3 { font-size: 1.3rem; margin: 34px 0 10px; }
  .detail p { color: #454b5e; margin-bottom: 12px; }
  .detail ul.did { margin: 8px 0 18px; list-style:none; }
  .detail ul.did li { padding: 10px 0 10px 28px; position:relative; border-bottom:1px solid var(--line); color:#454b5e; }
  .detail ul.did li::before { content:''; position:absolute; left:2px; top:18px; width:9px; height:9px; border-radius:50%; background: var(--terracotta); }

  /* highlights stat chips */
  .highlights { display:flex; flex-wrap:wrap; gap: 12px; margin: 4px 0 6px; }
  .highlights .hl { background: var(--peach); border:1px solid var(--line); border-radius: 14px; padding: 14px 18px; flex: 1 1 auto; min-width: 160px; }
  .highlights .hl b { font-family:'Fraunces',serif; font-weight:600; font-size: 1.05rem; color: var(--rust); display:block; }
  .highlights .hl span { font-size: 0.82rem; color: var(--muted); }

  .deck-list { list-style: none; margin: 8px 0 18px; }
  .deck-list li { background: var(--card); border:1px solid var(--line); border-radius: 12px; padding: 13px 17px; margin-bottom: 8px; font-size: 0.95rem; display:flex; align-items:center; gap: 10px; }
  .deck-list li::before { content: "▦"; color: var(--clay); }
  .skills { display:flex; flex-wrap:wrap; gap:8px; margin-top: 18px; padding: 0; }
  .skills li { list-style:none; font-size: 0.8rem; color: var(--olive); background: #ece8f6; border:1px solid #ddd5ee; border-radius: 999px; padding: 6px 14px; margin: 0; }
  .videos { display:grid; gap: 18px; margin: 10px 0 8px; }
  .videos .vid iframe { width:100%; aspect-ratio:16/9; border:0; border-radius:14px; background:#000; display:block; box-shadow: 0 14px 30px rgba(33,26,44,.16); }
  .videos .vcap { font-size:0.82rem; color: var(--muted); margin-top: 8px; }
  .gallery { display:grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin: 24px 0 10px; }
  @media (max-width:640px){ .gallery { grid-template-columns: 1fr 1fr; } }
  .gallery .cell { height: 170px; border-radius: 14px; overflow:hidden; background: var(--sand); }
  .gallery .cell img { width:100%; height:100%; object-fit:cover; display:block; }
  .links-row { display:flex; gap: 14px; flex-wrap: wrap; margin: 16px 0 4px; }
  .links-row a { font-size: 0.9rem; border:1px solid var(--line); padding:8px 16px; border-radius:999px; background:var(--card); }
  .links-row a:hover { background: var(--peach); text-decoration:none; }

  /* ---- contact ---- */
  .contact { text-align: center; padding: 100px 0; }
  .contact h2 { margin-bottom: 18px; }
  .contact p { color: var(--muted); max-width: 520px; margin: 0 auto 30px; }
  .contact-info { display:inline-flex; flex-direction: column; gap: 14px; margin-top: 6px; text-align: center; }
  .contact-info a { font-family:'Fraunces',serif; font-size: 1.35rem; color: var(--ink); }
  .contact-info a:hover { color: var(--terracotta); text-decoration: none; }
  .contact-info .ci-label { display:block; font-family:'Work Sans',sans-serif; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--clay); margin-bottom: 2px; }
  footer { text-align:center; padding: 36px 0 44px; color: var(--muted); font-size: 0.82rem; border-top: 1px solid var(--line); }

  /* logo-mode thumbnails */
  .proj-card .thumb.logo { background:#fff; }
  .proj-card .thumb.logo img { object-fit: contain; padding: 30px; transition:none; }
  .proj-card:hover .thumb.logo img { transform:none; }

  /* zoomable photos */
  .zoomwrap { cursor: zoom-in; }
  body.editing .zoomwrap { cursor: pointer; }

  /* clickable decks */
  .deck-list li.deck-open { cursor: pointer; transition: background .2s ease, border-color .2s ease, transform .2s ease; }
  .deck-list li.deck-open:hover { background: var(--peach); border-color: var(--terracotta); transform: translateX(3px); }
  .deck-list li .deckview { margin-left: auto; color: var(--terracotta); font-size: 0.8rem; font-weight: 500; white-space: nowrap; }

  /* fun-fact animation */
  .ff-anim { position: relative; animation: ffpulse 3.4s ease-in-out infinite; }
  @keyframes ffpulse { 0%,100%{ box-shadow: 0 0 0 0 rgba(85,96,168,0); } 50%{ box-shadow: 0 0 0 6px rgba(85,96,168,.10); } }
  .ff-anim .ff-tag { display:inline-block; animation: ffwiggle 3.4s ease-in-out infinite; transform-origin: left center; }
  @keyframes ffwiggle { 0%,92%,100%{ transform: rotate(0); } 94%{ transform: rotate(-4deg);} 97%{ transform: rotate(3deg);} }
  .ff-anim .ff-img { animation: fffloat 4s ease-in-out infinite; }
  @keyframes fffloat { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-6px);} }
  .ff-anim::after { content:'✶'; position:absolute; top:-10px; right:-6px; font-size:1.4rem; color: var(--gold); animation: ffspin 5s linear infinite; }
  @keyframes ffspin { from{ transform: rotate(0);} to{ transform: rotate(360deg);} }
  @media (prefers-reduced-motion: reduce){ .ff-anim,.ff-anim *,.ff-anim::after{ animation:none !important; } }

  /* lightbox */
  #lightbox { position: fixed; inset: 0; z-index: 1000; display:none; align-items:center; justify-content:center;
    background: rgba(26,22,38,.93); backdrop-filter: blur(4px); padding: 40px; }
  #lightbox.on { display:flex; animation: lbfade .25s ease; }
  @keyframes lbfade { from{opacity:0;} to{opacity:1;} }
  #lightbox img { max-width: 92vw; max-height: 88vh; border-radius: 10px; box-shadow: 0 30px 80px rgba(0,0,0,.5); object-fit: contain; }
  #lightbox iframe { width: 92vw; height: 88vh; border:0; border-radius: 10px; background:#fff; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  #lightbox .lb-close { position: absolute; top: 22px; right: 26px; background: rgba(238,241,244,.96); color: var(--ink);
    border:0; width: 44px; height: 44px; border-radius: 50%; font-size: 1.3rem; cursor: pointer; line-height:1; }
  #lightbox .lb-close:hover { background:#fff; }
  #lightbox .lb-bar { position:absolute; top: 24px; left: 26px; display:flex; gap:12px; align-items:center; }
  #lightbox .lb-cap { color:#f2e8da; font-size:.86rem; letter-spacing:.04em; }
  #lightbox .lb-tab { font-family:'Work Sans',sans-serif; font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; background:#c3b2e0; color:#241a2e; padding:8px 14px; border-radius:999px; text-decoration:none; }

  /* ---- Edit mode ---- */
  #editbar { position:fixed; right:18px; bottom:18px; z-index:999; display:flex; gap:8px;
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:8px;
    box-shadow:0 8px 30px rgba(33,26,44,.18); align-items:center; font-size:.86rem; }
  #editbar button { font-family:inherit; font-size:.84rem; cursor:pointer; border-radius:9px;
    border:1px solid var(--line); background:var(--cream); color:var(--ink); padding:7px 12px; }
  #editbar button.primary { background:var(--terracotta); border-color:var(--terracotta); color:#fff; }
  #editbar button.on { background:var(--olive); border-color:var(--olive); color:#fff; }
  #editbar .hint { color:var(--muted); padding:0 4px; max-width:180px; line-height:1.25; }
  body.editing [data-imgkey] { outline:2px dashed var(--clay); outline-offset:2px; cursor:pointer; position:relative; }
  body.editing [data-imgkey]:hover { outline-color:var(--terracotta); }
  body.editing [data-imgkey]::after { content:'↑ Replace photo'; position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%); background:rgba(33,26,44,.82); color:#fff; font-size:.78rem;
    padding:5px 10px; border-radius:8px; pointer-events:none; white-space:nowrap;
    font-family:'Work Sans',sans-serif; opacity:0; transition:opacity .15s; z-index:5; }
  body.editing [data-imgkey]:hover::after { opacity:1; }
</style>

e-production meeting (PPM) deck, organised cast, crew, locations and schedule, and kept the shoot running on the floor. The film starred Bollywood actor Ashwin Mushran.</p>\n    \n    <h3 class=\"rv\">Decks I made</h3><ul class=\"deck-list rv\"><li class=\"deck-open\" data-pdf=\"assets/col-shortfilm.pdf\" data-title=\"Happy Anniversary — PPM Deck\">Happy Anniversary — PPM Deck<span class=\"deckview\">Open ↗</span></li></ul>\n    <h3 class=\"rv\">What I did</h3>\n    <ul class=\"did rv\"><li>Production Head — ran the shoot end to end</li><li>Built the full pre-production (PPM) deck</li><li>Cast, crew, locations and scheduling</li><li>Directed logistics on the floor</li><li>Worked with the lead actor, Ashwin Mushran</li></ul>\n    <h3 class=\"rv\">Photos</h3><div class=\"gallery rv\"><div class=\"cell zoomwrap\"><img src=\"images/col-sf-1.jpg\" data-imgkey=\"images/col-sf-1.jpg\" alt=\"Photo\" onerror=\"this.parentNode.innerHTML='&lt;div class=\\'ph\\' data-imgkey=\\'images/col-sf-1.jpg\\'&gt;&lt;span&gt;Photo&lt;/span&gt;&lt;/div&gt;'\"></div><div class=\"cell zoomwrap\"><img src=\"images/col-sf-2.jpg\" data-imgkey=\"images/col-sf-2.jpg\" alt=\"Photo\" onerror=\"this.parentNode.innerHTML='&lt;div class=\\'ph\\' data-imgkey=\\'images/col-sf-2.jpg\\'&gt;&lt;span&gt;Photo&lt;/span&gt;&lt;/div&gt;'\"></div><div class=\"cell zoomwrap\"><img src=\"images/col-sf-3.jpg\" data-imgkey=\"images/col-sf-3.jpg\" alt=\"Photo\" onerror=\"this.parentNode.innerHTML='&lt;div class=\\'ph\\' data-imgkey=\\'images/col-sf-3.jpg\\'&gt;&lt;span&gt;Photo&lt;/span&gt;&lt;/div&gt;'\"></div><div class=\"cell zoomwrap\"><img src=\"images/col-sf-4.jpg\" data-imgkey=\"images/col-sf-4.jpg\" alt=\"Photo\" onerror=\"this.parentNode.innerHTML='&lt;div class=\\'ph\\' data-imgkey=\\'images/col-sf-4.jpg\\'&gt;&lt;span&gt;Photo&lt;/span&gt;&lt;/div&gt;'\"></div><div class=\"cell zoomwrap\"><img src=\"images/col-sf-5.jpg\" data-imgkey=\"images/col-sf-5.jpg\" alt=\"Photo\" onerror=\"this.parentNode.innerHTML const BAKED = window.__OVERRIDES__ || {};
let IMGOV  = Object.assign({}, BAKED.img  || {}, JSON.parse(localStorage.getItem('pf_img')  || '{}'));
let HTMLOV = Object.assign({}, BAKED.html || {}, JSON.parse(localStorage.getItem('pf_html') || '{}'));
let EDIT = false, CURROUTE = 'home';
function imgSrc(src){ return IMGOV[src] || src; }
function saveImg(){ localStorage.setItem('pf_img', JSON.stringify(IMGOV)); }
function saveHtml(){ localStorage.setItem('pf_html', JSON.stringify(HTMLOV)); }

const NAVTABS = [
  {id:'home', label:'Home'},
  {id:'about', label:'About'},
  ...PLACES.map(p => ({id:p.id, label:p.tab})),
  {id:'contact', label:'Contact'}
];
tabsEl.innerHTML = NAVTABS.map(t => `<button class="tab" data-tab="${t.id}" onclick="go('${t.id}')">${t.label}</button>`).join('');

function thumb(src, label){
  return `<img src="${imgSrc(src)}" data-imgkey="${src}" alt="${label}" onerror="this.parentNode.innerHTML='<div class=\\'ph\\' data-imgkey=\\'${src}\\'><span>${label}</span></div>'" />`;
}
function logoThumb(src, label){
  return `<img src="${imgSrc(src)}" data-imgkey="${src}" alt="${label}" onerror="this.parentNode.innerHTML='<div class=\\'ph logo-ph\\' data-imgkey=\\'${src}\\'><span>${label}</span></div>'" />`;
}
function slideshow(imgs, label, tall){
  return `<div class="slides${tall?' tall':''}" data-slides>
    ${imgs.map((s,i)=>`<div class="slide zoomwrap${i===0?' on':''}">${thumb(s,label)}</div>`).join('')}
    ${imgs.length>1?`<button class="snav prev" aria-label="Previous photo">‹</button><button class="snav next" aria-label="Next photo">›</button>`:''}
    <div class="dots">${imgs.map((_,i)=>`<span class="dot${i===0?' on':''}"></span>`).join('')}</div>
  </div>`;
}

/* ---------------- ROUTER ---------------- */
let SS;
function initSlideshows(){
  clearInterval(SS);
  const shows = [...document.querySelectorAll('[data-slides]')];
  const heros = [...document.querySelectorAll('[data-herobg]')];
  if (!shows.length && !heros.length) return;
  SS = setInterval(() => {
    shows.forEach(sh => {
      const slides = [...sh.querySelectorAll('.slide')];
      const dots = [...sh.querySelectorAll('.dot')];
      if (slides.length < 2) return;
      const cur = slides.findIndex(s => s.classList.contains('on'));
      slides[cur].classList.remove('on'); if (dots[cur]) dots[cur].classList.remove('on');
      const nx = (cur + 1) % slides.length;
      slides[nx].classList.add('on'); if (dots[nx]) dots[nx].classList.add('on');
    });
    heros.forEach(h => {
      const imgs = [...h.querySelectorAll('.hb')];
      if (imgs.length < 2) return;
      const cur = imgs.findIndex(s => s.classList.contains('on'));
      imgs[cur].classList.remove('on');
      imgs[(cur+1)%imgs.length].classList.add('on');
    });
  }, 4200);
}

/* reveal — robust: in-view on load + on scroll, never leaves content hidden */
function revealInView(){
  app.querySelectorAll('.rv:not(.in)').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.top < window.innerHeight * 0.94 && r.bottom > 0) el.classList.add('in');
  });
}
function observeReveals(){
  // first paint at opacity 0, then reveal above-the-fold so the transition animates
  requestAnimationFrame(() => requestAnimationFrame(revealInView));
  // safety net: if anything is still hidden shortly after, show it (covers no-IntersectionObserver / odd viewports)
  clearTimeout(window.__revSafe);
  window.__revSafe = setTimeout(revealInView, 600);
}
window.addEventListener('scroll', revealInView, { passive: true });
window.addEventListener('resize', revealInView, { passive: true });

function setSlide(sh, idx){
  const slides=[...sh.querySelectorAll('.slide')], dots=[...sh.querySelectorAll('.dot')];
  const n=slides.length; if(!n) return; idx=((idx%n)+n)%n;
  slides.forEach((s,i)=>s.classList.toggle('on', i===idx));
  dots.forEach((d,i)=>d.classList.toggle('on', i===idx));
}
document.addEventListener('click', e => {
  if (EDIT) return;
  const nav = e.target.closest('.snav');
  if (nav) {
    e.preventDefault(); e.stopPropagation();
    const sh = nav.closest('.slides');
    const cur = [...sh.querySelectorAll('.slide')].findIndex(s => s.classList.contains('on'));
    setSlide(sh, cur + (nav.classList.contains('next') ? 1 : -1));
    clearInterval(SS); initSlideshows();
    return;
  }
  const dot = e.target.closest('.dot');
  if (dot) {
    const sh = dot.closest('.slides');
    setSlide(sh, [...sh.querySelectorAll('.dot')].indexOf(dot));
    clearInterval(SS); initSlideshows();
  }
});

function go(tab, proj){
  let html, activeTab = tab;
  if (tab === 'home') html = home();
  else if (tab === 'about') html = about();
  else if (tab === 'contact') html = contact();
  else {
    const p = PLACES.find(x => x.id === tab);
    if (!p) { html = home(); activeTab = 'home'; }
    else if (proj) {
      const pr = p.projects.find(x => x.id === proj);
      html = pr ? detail(p, pr) : place(p);
    } else html = place(p);
  }
  CURROUTE = proj ? `${tab}/${proj}` : tab;
  paint(HTMLOV[CURROUTE] != null ? HTMLOV[CURROUTE] : html);
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === activeTab));
  window.scrollTo({top:0, behavior: proj ? 'instant' : 'auto'});
  location.hash = proj ? `${tab}/${proj}` : tab;
  initSlideshows();
  observeReveals();
  if (EDIT) applyEditable();
}

function paint(html){
  app.innerHTML = html;
  app.querySelectorAll('img[data-imgkey]').forEach(im => {
    const o = IMGOV[im.getAttribute('data-imgkey')];
    if (o) im.src = o;
  });
  app.querySelectorAll('[data-imgkey][data-bg], .pc-bg[data-imgkey], .hb[data-bg]').forEach(el => {
    const k = el.getAttribute('data-imgkey') || el.getAttribute('data-bg');
    if (IMGOV[k]) el.style.backgroundImage = `url('${IMGOV[k]}')`;
  });
}

function toggleEdit(on){
  EDIT = on;
  document.body.classList.toggle('editing', on);
  const t = document.getElementById('etoggle');
  t.textContent = on ? '✓ Done' : '✎ Edit';
  t.classList.toggle('on', on);

  document.getElementById('ereset').style.display = on ? '' : 'none';
  document.getElementById('ehint').textContent = on
    ? 'Click any photo to replace it. Click text to edit. Then Download to save.'
    : 'Edit mode lets you swap photos & fix text.';
  if (on) applyEditable(); else { app.removeAttribute('contenteditable'); }
}

function applyEditable(){
  app.setAttribute('contenteditable', 'true');
  app.setAttribute('spellcheck', 'false');
}

app.addEventListener('click', e => {
  if (!EDIT) return;
  const el = e.target.closest('[data-imgkey]');
  if (!el) return;
  e.preventDefault();
  pendingKey = el.getAttribute('data-imgkey');
  fileInput.value = '';
  fileInput.click();
});

fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (!f || !pendingKey) return;
  const reader = new FileReader();
  reader.onload = () => resizeDataURL(reader.result, 1600, dataUrl => {
    IMGOV[pendingKey] = dataUrl;
    try { saveImg(); } catch(err){ alert('Browser storage is full — Download your site to keep changes, then Reset.'); }
    pendingKey = null;
    go(...CURROUTE.split('/'));
  });
  reader.readAsDataURL(f);
});

function resizeDataURL(dataUrl, maxW, cb){
  const im = new Image();
  im.onload = () => {
    const scale = Math.min(1, maxW / im.width);
    const c = document.createElement('canvas');
    c.width = Math.round(im.width * scale);
    c.height = Math.round(im.height * scale);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    cb(c.toDataURL('image/jpeg', 0.82));
  };
  im.onerror = () => cb(dataUrl);
  im.src = dataUrl;
}

let saveTimer = null;
app.addEventListener('input', () => {
  if (!EDIT) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const clone = app.cloneNode(true);
    clone.querySelectorAll('img[data-imgkey]').forEach(im => im.setAttribute('src', im.getAttribute('data-imgkey')));
    HTMLOV[CURROUTE] = clone.innerHTML;
    try { saveHtml(); } catch(err){ alert('Browser storage is full — Download your site to keep changes, then Reset.'); }
  }, 500);
});

function resetEdits(){
  if (!confirm('Remove all your photo and text edits and restore the original site?')) return;
  IMGOV = {}; HTMLOV = {};
  localStorage.removeItem('pf_img'); localStorage.removeItem('pf_html');
  go(...CURROUTE.split('/'));
}

function downloadSite(){
  const wasEdit = EDIT;
  toggleEdit(false);
  app.innerHTML = '';
  editbar.remove(); fileInput.remove();
  const existing = document.getElementById('bakeov'); if (existing) existing.remove();
  const payload = '<scr'+'ipt id="bakeov">window.__OVERRIDES__=' + JSON.stringify({img:IMGOV, html:HTMLOV}) + ';</scr'+'ipt>';
  let doc = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  doc = doc.replace('</head>', payload + '\n</head>');
  const blob = new Blob([doc], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'index.html';
  a.click();
  URL.revokeObjectURL(a.href);
  document.body.appendChild(editbar);
  document.body.appendChild(fileInput);
  go(...CURROUTE.split('/'));
  if (wasEdit) toggleEdit(true);
}

const lightbox = document.createElement('div');
lightbox.id = 'lightbox';
document.body.appendChild(lightbox);

function openLightbox(src, title, isPdf){
  const body = isPdf
    ? `<iframe src="${src}"></iframe>`
    : `<img src="${src}" alt="${title || ''}">`;
  lightbox.innerHTML = `<button class="lb-close" aria-label="Close">×</button>
    <div class="lb-bar">${title ? `<span class="lb-cap">${title}</span>` : ''}<a class="lb-tab" href="${src}" target="_blank" rel="noopener">Open in new tab ↗</a></div>
    ${body}`;
  lightbox.classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeLightbox(){
  lightbox.classList.remove('on');
  lightbox.innerHTML = '';
  document.body.style.overflow = '';
}
lightbox.addEventListener('click', e => {
  if (e.target === lightbox || e.target.closest('.lb-close')) closeLightbox();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && lightbox.classList.contains('on')) closeLightbox(); });

app.addEventListener('click', e => {
  if (EDIT) return;
  const deck = e.target.closest('.deck-open');
  if (deck) { e.preventDefault(); openLightbox(deck.getAttribute('data-pdf'), deck.getAttribute('data-title'), true); return; }
  const zw = e.target.closest('.zoomwrap');
  if (zw) { const im = zw.querySelector('img'); if (im) { e.preventDefault(); openLightbox(im.getAttribute('src'), im.getAttribute('alt') || '', false); } }
});

function route(){
  const h = location.hash.replace('#','');
  if (!h) return go('home');
  const [tab, proj] = h.split('/');
  go(tab, proj);
}
window.addEventListener('hashchange', route);
